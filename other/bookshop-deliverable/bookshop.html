<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>gamiTask — Café Bookshop</title>
<meta name="viewport" content="width=1440" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Inter',system-ui,sans-serif;color:#1a1a1a;background:#0e0d11}
body{min-height:100vh}

/* DA tokens — both variants are cozy-café family, no serif. */
[data-da="bookshop"]{
  --font-display:"DM Sans",system-ui,sans-serif;
  --font-body:"Inter",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;
  --bg-app:#f1e3c8;
  --bg-canvas:#e6d3ad;
  --bg-panel:#fbf3df;
  --bg-panel-2:#f0e0c0;
  --bg-deep:#3a2418;
  --ink:#3a2418;
  --ink-2:#6a4a30;
  --ink-3:rgba(58,36,24,.55);
  --ink-4:rgba(58,36,24,.22);
  --accent:#b85530;
  --accent-2:#d97842;
  --accent-soft:#f3d2b8;
  --moss:#7a8e4a;
  --moss-soft:#dde0bd;
  --gold:#c89a3a;
  --gold-soft:#f0dba0;
  --berry:#a04050;
  --focus:#b85530;--break:#7a8e4a;--paused:#c89a3a;
  --border:rgba(106,74,48,.20);
  --border-strong:rgba(106,74,48,.34);
  --shadow-sm:0 1px 2px rgba(74,47,27,.08),0 2px 8px rgba(74,47,27,.06);
  --shadow-md:0 4px 12px rgba(74,47,27,.14),0 8px 24px rgba(74,47,27,.10);
  --shadow-lg:0 12px 32px rgba(74,47,27,.20),0 24px 48px rgba(74,47,27,.12);
  --radius-sm:8px;--radius:14px;--radius-lg:20px;--radius-xl:28px;
}

[data-da="garden"]{
  --font-display:"Outfit",system-ui,sans-serif;
  --font-body:"Inter",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;
  --bg-app:#f6f1e2;
  --bg-canvas:#e8e0c8;
  --bg-panel:#fdf9ec;
  --bg-panel-2:#eee5cc;
  --bg-deep:#2a3a2a;
  --ink:#2a3a2a;
  --ink-2:#4a6048;
  --ink-3:rgba(42,58,42,.55);
  --ink-4:rgba(42,58,42,.20);
  --accent:#5e8a5a;
  --accent-2:#7aa478;
  --accent-soft:#d8e8d4;
  --moss:#5e8a5a;
  --moss-soft:#d8e8d4;
  --gold:#d4a04a;
  --gold-soft:#f3deb3;
  --berry:#c5612e;
  --focus:#5e8a5a;--break:#d4a04a;--paused:#c5612e;
  --border:rgba(42,58,42,.16);
  --border-strong:rgba(42,58,42,.30);
  --shadow-sm:0 1px 2px rgba(42,58,42,.06),0 2px 8px rgba(42,58,42,.05);
  --shadow-md:0 4px 12px rgba(42,58,42,.10),0 8px 24px rgba(42,58,42,.07);
  --shadow-lg:0 12px 32px rgba(42,58,42,.14),0 24px 48px rgba(42,58,42,.08);
  --radius-sm:10px;--radius:16px;--radius-lg:22px;--radius-xl:28px;
}

/* ────── Switcher bar ────── */
.da-bar{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:8px;padding:14px 28px;background:rgba(14,13,17,.85);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.06)}
.da-bar h1{font-family:"DM Sans",sans-serif;font-weight:600;color:#f4ecd8;font-size:18px;letter-spacing:-.01em;margin-right:auto}
.da-bar h1 span.s{font-weight:400;color:rgba(244,236,216,.55);margin-left:8px}
.da-tab{appearance:none;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#f4ecd8;padding:8px 16px;border-radius:99px;font:600 13px 'Inter';cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .2s}
.da-tab:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}
.da-tab[aria-pressed="true"]{background:#f4ecd8;color:#1a1a1a;border-color:#f4ecd8}
.da-tab .dot{width:10px;height:10px;border-radius:50%}
.da-view{padding:32px;display:flex;flex-direction:column;gap:48px}
.da-section{border-radius:24px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.4)}

/* ────── Frame ────── */
.frame{position:relative;width:100%;background:var(--bg-app);color:var(--ink);font-family:var(--font-body);overflow:hidden}
.frame-label{position:absolute;top:16px;left:20px;z-index:50;background:rgba(0,0,0,.55);color:#fff;font:500 11px 'Inter';letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:6px}

/* ────── Top bar ────── */
.tb{display:flex;align-items:center;gap:4px;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--bg-panel);position:relative;z-index:10}
.tb-brand{display:flex;align-items:center;gap:10px;margin-right:24px}
.tb-logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-family:var(--font-display);font-size:18px}
.tb-name{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:-.02em}
.tb-room{font-size:12px;color:var(--ink-3);margin-left:8px;font-weight:500}
.tb-spacer{flex:1}
.tb-btn{appearance:none;background:transparent;border:none;color:var(--ink-2);padding:8px 12px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 11px var(--font-body);min-width:60px;transition:background .15s}
.tb-btn:hover{background:var(--bg-panel-2)}
.tb-btn .ic{font-size:18px;line-height:1}
.tb-btn[data-active="true"]{color:var(--accent);background:var(--accent-soft)}

.timer{display:inline-flex;align-items:center;gap:10px;padding:8px 14px;border-radius:99px;background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent);font-weight:600;font-size:13px}
.timer .num{font-family:var(--font-mono);font-weight:600;font-size:18px;color:var(--ink);letter-spacing:-.02em}
.timer .pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}

.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--bg-panel-2);font:600 12px var(--font-body);color:var(--ink-2);border:1px solid var(--border)}
.badge.gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 35%,transparent)}
.badge.streak{color:var(--accent)}

/* ────── Stage layout ────── */
.stage{display:grid;grid-template-columns:300px 1fr 320px;gap:18px;padding:18px;height:720px}
.col{display:flex;flex-direction:column;gap:14px;min-height:0}
.canvas{position:relative;border-radius:var(--radius-lg);overflow:hidden;background:var(--bg-canvas);box-shadow:var(--shadow-md);min-height:0}
.canvas-inner{position:absolute;inset:0}

/* ────── Panels ────── */
.panel{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.panel-title{font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.panel-title .ic{font-size:18px}
.panel-meta{font-size:11px;color:var(--ink-3);font-weight:500}
.panel-body{padding:12px 14px;overflow:auto;flex:1}

/* Tasks */
.task{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:10px;cursor:pointer;transition:background .15s}
.task:hover{background:var(--bg-panel-2)}
.task.done{opacity:.55}
.task.done .t{text-decoration:line-through}
.cb{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--ink-4);flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--bg-panel)}
.cb.checked{background:var(--accent);border-color:var(--accent);color:#fff;font-size:11px;font-weight:800}
.task .t{flex:1;font-size:13.5px;color:var(--ink)}
.task .cat{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.task .pts{font-size:11px;font-weight:700;color:var(--gold);font-family:var(--font-mono)}
.task-add{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border);align-items:center}
.task-add input{flex:1;border:none;background:var(--bg-panel-2);border-radius:8px;padding:8px 10px;font:500 13px var(--font-body);color:var(--ink);outline:none}
.task-add button{appearance:none;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 12px;font:600 13px var(--font-body);cursor:pointer}
.section-h{font:600 11px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:8px 4px 4px}

/* Player & leaderboard */
.player-card{padding:16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
.av-circle{width:48px;height:48px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-family:var(--font-display);font-size:18px;flex:0 0 auto;position:relative}
.av-circle::after{content:'';position:absolute;bottom:0;right:0;width:14px;height:14px;border-radius:50%;background:#7ec87e;border:2px solid var(--bg-panel)}
.player-name{font-weight:700;font-size:14px;font-family:var(--font-display);letter-spacing:-.01em}
.player-sub{font-size:12px;color:var(--ink-3);margin-top:2px;font-weight:500}
.lvl-bar{margin:10px 16px;background:var(--bg-panel-2);height:6px;border-radius:99px;overflow:hidden;position:relative}
.lvl-bar > i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:99px}
.lvl-meta{display:flex;justify-content:space-between;padding:0 16px;font-size:11px;color:var(--ink-3);font-weight:500}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px}
.stat{background:var(--bg-panel-2);border-radius:12px;padding:10px 12px}
.stat .lbl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.stat .v{font-family:var(--font-display);font-size:22px;font-weight:700;margin-top:2px;letter-spacing:-.02em}
.lb-row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:8px}
.lb-row:hover{background:var(--bg-panel-2)}
.lb-row .rk{width:22px;text-align:center;font-family:var(--font-mono);font-size:12px;color:var(--ink-3);font-weight:600}
.lb-row.you{background:var(--accent-soft)}
.lb-row .nm{flex:1;font-size:13px;font-weight:500}
.lb-row .co{font-family:var(--font-mono);font-size:12px;color:var(--gold);font-weight:600}
.av-mini{width:22px;height:22px;border-radius:50%;font-size:10px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}

/* Chat — ré-intégré */
.chat{position:absolute;left:18px;bottom:18px;width:300px;background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);overflow:hidden;display:flex;flex-direction:column}
.chat-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--bg-panel-2)}
.chat-h .dot{width:8px;height:8px;border-radius:50%;background:#7ec87e}
.chat-h .ti{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:-.01em;flex:1}
.chat-h .meta{font-size:10.5px;color:var(--ink-3);font-weight:500}
.chat-body{padding:8px 10px;display:flex;flex-direction:column;gap:6px;max-height:160px;overflow:auto}
.chat-msg{font-size:12.5px;line-height:1.45;display:flex;gap:6px;align-items:baseline}
.chat-msg .who{font-weight:700;font-family:var(--font-display);font-size:12px}
.chat-msg.system{color:var(--ink-3);font-style:italic;font-size:11.5px}
.chat-input{display:flex;border-top:1px solid var(--border)}
.chat-input input{flex:1;border:none;background:transparent;padding:9px 12px;font:500 13px var(--font-body);color:var(--ink);outline:none}
.chat-input .send{appearance:none;background:transparent;border:none;color:var(--accent);font-size:18px;padding:0 12px;cursor:pointer}

/* Toast & FAB */
.toast{position:absolute;top:80px;left:50%;transform:translateX(-50%);background:var(--bg-deep);color:#fff;padding:10px 18px;border-radius:99px;font:600 13px var(--font-body);box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;z-index:30}
.fab{position:absolute;background:var(--accent);color:#fff;border:none;border-radius:99px;padding:11px 18px;font:600 13px var(--font-body);box-shadow:var(--shadow-md);cursor:pointer;display:flex;align-items:center;gap:8px}
.coin-pop{position:absolute;font-size:16px;font-weight:700;color:var(--gold);font-family:var(--font-mono);pointer-events:none;animation:coinFly 2.5s ease-out infinite;background:var(--bg-panel);padding:4px 10px;border-radius:99px;box-shadow:var(--shadow-sm)}
@keyframes coinFly{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1;transform:translateY(-12px) scale(1.05)}80%{opacity:1;transform:translateY(-30px) scale(1)}100%{opacity:0;transform:translateY(-50px) scale(.8)}}

/* Shop */
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.shop-item{background:var(--bg-panel-2);border:1px solid var(--border);border-radius:14px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.shop-item .em{font-size:30px}
.shop-item .nm{font-size:12px;font-weight:600}
.shop-item .pr{font-size:11px;color:var(--gold);font-weight:700;font-family:var(--font-mono)}
.shop-item.owned{border-color:var(--accent);background:var(--accent-soft)}
.shop-item.owned::after{content:'✓';position:absolute;top:6px;right:8px;color:var(--accent);font-weight:700;font-size:12px}

/* Join */
.join{display:flex;align-items:center;justify-content:center;height:100%;padding:40px;background:var(--bg-canvas);position:relative}
.join-card{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius-xl);padding:32px;width:380px;box-shadow:var(--shadow-lg);text-align:center;position:relative;z-index:2}
.join-art{width:96px;height:96px;border-radius:50%;background:var(--accent);margin:0 auto 18px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:40px;box-shadow:var(--shadow-md)}
.join-card h2{font-family:var(--font-display);font-size:28px;font-weight:700;letter-spacing:-.025em;margin-bottom:6px;line-height:1.1}
.join-card .sub{color:var(--ink-3);font-size:14px;margin-bottom:24px}
.join-input{width:100%;background:var(--bg-panel-2);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;font:500 15px var(--font-body);color:var(--ink);outline:none;text-align:center}
.join-input:focus{border-color:var(--accent)}
.join-pal{display:flex;justify-content:center;gap:8px;margin:18px 0 24px}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .15s}
.sw:hover{transform:scale(1.12)}
.sw.sel{border-color:var(--ink);transform:scale(1.15)}
.join-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:14px;font:600 15px var(--font-body);cursor:pointer;letter-spacing:.005em}

/* DS */
.ds{padding:32px;background:var(--bg-app);color:var(--ink);font-family:var(--font-body)}
.ds-hd{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start;padding-bottom:28px;border-bottom:1px solid var(--border);margin-bottom:28px}
.ds-hd h2{font-family:var(--font-display);font-size:42px;font-weight:700;letter-spacing:-.03em;line-height:1.02}
.ds-hd h2 .em{color:var(--accent);font-weight:700}
.ds-hd p{color:var(--ink-2);font-size:14.5px;line-height:1.6;margin-top:14px;max-width:46ch}
.ds-meta{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:13px;color:var(--ink-2);align-self:start}
.ds-meta dt{color:var(--ink-3);font-weight:500}
.ds-meta dd{font-weight:500}
.ds-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:24px}
.ds-block{grid-column:span 4;background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-sm)}
.ds-block.wide{grid-column:span 8}
.ds-block.full{grid-column:span 12}
.ds-block h3{font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px}
.swatch-row{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:64px;display:flex;flex-direction:column;gap:4px}
.swatch .chip{height:64px;border-radius:10px;border:1px solid var(--border)}
.swatch .nm{font-size:11px;font-weight:600;line-height:1.2}
.swatch .hx{font-family:var(--font-mono);font-size:10px;color:var(--ink-3)}
.type-row{display:flex;flex-direction:column;gap:14px}
.type-row .sample{padding:6px 0;border-top:1px solid var(--border)}
.type-row .sample:first-child{border-top:none}
.type-row .lbl{font-size:10px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin-bottom:4px;font-family:var(--font-body)}
.tokens{display:grid;grid-template-columns:auto 1fr auto;gap:8px 14px;font-size:12.5px}
.tokens code{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);background:var(--bg-panel-2);padding:2px 6px;border-radius:4px}
.tokens .pv{justify-self:end;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}
.cmpt-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.mood{padding:0;overflow:hidden}
.mood-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:140px 140px;gap:4px}
.mood-cell{position:relative;overflow:hidden}
.mood-cell svg{width:100%;height:100%;display:block}
.mood-quote{padding:18px;font-family:var(--font-display);font-weight:500;font-size:18px;color:var(--ink-2);line-height:1.4;border-top:1px solid var(--border);letter-spacing:-.01em}
.note{background:var(--bg-panel-2);border-radius:var(--radius);padding:18px;font-family:var(--font-mono);font-size:12.5px;line-height:1.6;color:var(--ink-2);overflow-x:auto;white-space:pre}

/* DA-specific tweaks */
[data-da="bookshop"] .canvas{background:linear-gradient(180deg,#e6d3ad,#d8c198)}
[data-da="bookshop"] .frame{background-image:radial-gradient(circle at 20% 0%, rgba(255,200,120,.18), transparent 50%)}
[data-da="garden"] .canvas{background:linear-gradient(180deg,#e8e0c8 0%,#dde0bd 100%)}
[data-da="garden"] .frame{background-image:radial-gradient(circle at 80% 0%, rgba(180,220,150,.20), transparent 55%)}
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState } = React;

/* ─────────── Iso Room ─────────── */
function IsoRoom({ palette, daKey }) {
  const TW=64,TH=32,COLS=9,ROWS=9;
  const cx=COLS*TW/2;
  const iso=(c,r)=>({x:(c-r)*TW/2+cx,y:(c+r)*TH/2});
  const wallH=104;
  const tiles=[];
  for(let r=0;r<ROWS;r++){for(let c=0;c<COLS;c++){
    const p=iso(c,r); const alt=(c+r)%2===0;
    tiles.push(<polygon key={`t${c}-${r}`} points={`${p.x},${p.y} ${p.x+TW/2},${p.y+TH/2} ${p.x},${p.y+TH} ${p.x-TW/2},${p.y+TH/2}`} fill={alt?palette.floor:palette.floorAlt} stroke={palette.floorLine} strokeWidth=".5"/>);
  }}
  const wTL=iso(0,0),wTR=iso(COLS,0),wBL=iso(0,ROWS);

          <line x1={cx+30} y1={wTL.y-wallH+43} x2={cx+86} y2={wTL.y-wallH+43} stroke={palette.deskLeg} strokeWidth="2"/>
        </g>

        <g>
          <rect x={cx-70} y={wTL.y-wallH+12} width="150" height="76" fill={palette.window} stroke={palette.deskLeg} strokeWidth="2" rx="2"/>

          {/* hanging plants */}

        if(it.kind==="plant")return <Plant key={i} x={p.x} y={p.y} leaf={palette.plant} pot={palette.plantPot}/>;
        return <Avatar key={i} x={p.x} y={p.y} a={it} ink={palette.ink} bub={palette.bubble}/>;
      })}

      {(()=>{const p=iso(7,2);return(

function Desk({x,y,top,leg,accent}){
  return (<g transform={`translate(${x},${y})`}>
    <polygon points="0,-22 32,-6 0,10 -32,-6" fill={top} stroke="rgba(0,0,0,.18)" strokeWidth="1"/>

function Plant({x,y,leaf,pot}){

function Avatar({x,y,a,ink,bub}){
  const sc=a.state==="focus"?"#e07070":a.state==="pause"?"#d4a04a":"#7ec87e";

    </g>
  </g>);
}

            {em:"🎩",n:"Chapeau melon",p:"150"},
            {em:"☕",n:"Tasse vintage",p:"80",owned:true},
            {em:"🕯️",n:"Bougie ambre",p:"60"},
            {em:"🪑",n:"Fauteuil cuir",p:"240"},
            {em:"🦉",n:"Chouette gardienne",p:"320"},
          ]:[
            {em:"🌿",n:"Monstera",p:"180",owned:true},
            {em:"🌻",n:"Tournesol",p:"50"},
            {em:"🪴",n:"Bonsaï",p:"260",owned:true},
            {em:"🧺",n:"Panier osier",p:"90"},
            {em:"🐦",n:"Mésange",p:"140"},
            {em:"🍵",n:"Théière matcha",p:"120"},
          ]).map((it,i)=>(
            <div key={i} className={"shop-item "+(it.owned?"owned":"")}>
              <div className="em">{it.em}</div>
              <div className="nm">{it.n}</div>
              <div className="pr">🪙 {it.p}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function MoodCell({daKey,variant}){
  const P=PALETTES[daKey];
  if(variant===0)return(<div className="mood-cell" style={{background:P.wall}}><svg viewBox="0 0 200 140" preserveAspectRatio="xMidYMid slice"><rect width="200" height="140" fill={P.wall}/><circle cx="155" cy="38" r="32" fill={P.accent} opacity=".88"/><rect x="20" y="80" width="160" height="6" fill={P.deskTop}/><rect x="40" y="40" width="20" height="50" fill={P.plant} opacity=".75"/></svg></div>);
  if(variant===1){
    if(daKey==="bookshop")return(<div className="mood-cell" style={{background:P.wall}}><svg viewBox="0 0 200 140" preserveAspectRatio="xMidYMid slice"><rect width="200" height="140" fill={P.wall}/>{Array.from({length:18}).map((_,i)=><rect key={i} x={4+i*11} y={30+(i%3)*4} width="9" height={56-(i%3)*4} fill={["#a04050","#7a8e4a","#c89a3a","#b85530","#6a4a30"][i%5]}/>)}<rect x="0" y="86" width="200" height="6" fill={P.deskLeg}/></svg></div>);
    return(<div className="mood-cell" style={{background:P.wall}}><svg viewBox="0 0 200 140" preserveAspectRatio="xMidYMid slice"><rect width="200" height="140" fill={P.wall}/><rect x="0" y="0" width="200" height="100" fill={P.window} opacity=".6"/>{[0,1,2,3].map(i=>(<g key={i} transform={`translate(${30+i*45}, 14)`}><line x1="0" y1="0" x2="0" y2="20" stroke={P.deskLeg} strokeWidth="1.5"/><ellipse cx="0" cy="26" rx="12" ry="6" fill={P.plantPot}/><ellipse cx="0" cy="20" rx="14" ry="10" fill={P.plant}/></g>))}</svg></div>);
  }
  if(variant===2)return(<div className="mood-cell" style={{background:P.accent}}><svg viewBox="0 0 200 140" preserveAspectRatio="xMidYMid slice"><rect width="200" height="140" fill={P.accent}/><circle cx="100" cy="70" r="42" fill={P.bubble} opacity=".22"/><circle cx="100" cy="70" r="22" fill={P.bubble} opacity=".4"/><text x="100" y="76" textAnchor="middle" fill={P.bubble} fontFamily="DM Sans, Outfit, sans-serif" fontWeight="800" fontSize="22" letterSpacing="-1">cozy.</text></svg></div>);
  if(variant===3)return(<div className="mood-cell" style={{background:P.wallShadow}}><svg viewBox="0 0 200 140" preserveAspectRatio="xMidYMid slice"><rect width="200" height="140" fill={P.wallShadow}/>{Array.from({length:6}).map((_,i)=>(<rect key={i} x={20+i*28} y="40" width="20" height="60" fill={i%2?P.plant:P.deskTop} rx="2"/>))}</svg></div>);
  if(variant===4)return(<div className="mood-cell" style={{background:P.bubble}}><svg viewBox="0 0 200 140" preserveAspectRatio="xMidYMid slice"><rect width="200" height="140" fill={P.bubble}/><circle cx="60" cy="74" r="30" fill={P.av1}/><circle cx="120" cy="68" r="25" fill={P.av2}/><circle cx="160" cy="80" r="20" fill={P.av3}/></svg></div>);
  if(variant===5)return(<div className="mood-cell" style={{background:P.floorAlt}}><svg viewBox="0 0 200 140" preserveAspectRatio="xMidYMid slice"><rect width="200" height="140" fill={P.floorAlt}/><path d={`M0 100 Q 50 70, 100 90 T 200 80 L 200 140 L 0 140 Z`} fill={P.plant} opacity=".75"/><path d={`M0 120 Q 60 100, 120 110 T 200 105 L 200 140 L 0 140 Z`} fill={P.plant}/></svg></div>);
  if(variant===6)return(<div className="mood-cell" style={{background:P.deskTop}}><svg viewBox="0 0 200 140" preserveAspectRatio="xMidYMid slice"><rect width="200" height="140" fill={P.deskTop}/><rect x="20" y="20" width="160" height="100" fill={P.bubble} opacity=".18" rx="6"/><text x="100" y="84" textAnchor="middle" fill={P.bubble} fontFamily="DM Sans, Outfit, sans-serif" fontWeight="700" fontSize="34" letterSpacing="-1.5">slow.</text></svg></div>);
  return(<div className="mood-cell" style={{background:P.plant}}><svg viewBox="0 0 200 140" preserveAspectRatio="xMidYMid slice"><rect width="200" height="140" fill={P.plant}/><circle cx="40" cy="40" r="14" fill={P.bubble} opacity=".4"/><circle cx="80" cy="80" r="10" fill={P.bubble} opacity=".5"/><circle cx="140" cy="50" r="18" fill={P.bubble} opacity=".35"/><circle cx="170" cy="100" r="8" fill={P.bubble} opacity=".55"/></svg></div>);
}

function DSPage({da}){
  const tokens = da.key==="bookshop"?[
    ["--bg-app","#f1e3c8","Wheat background"],
    ["--bg-panel","#fbf3df","Paper panel"],
    ["--accent","#b85530","Terracotta primary"],
    ["--moss","#7a8e4a","Olive success"],
    ["--gold","#c89a3a","Honey rewards"],
    ["--font-display","DM Sans","Sans-serif chaleureuse"],
    ["--radius-lg","20px","Soft cards"],
  ]:[
    ["--bg-app","#f6f1e2","Cream background"],
    ["--bg-panel","#fdf9ec","Paper panel"],
    ["--accent","#5e8a5a","Sage primary"],
    ["--gold","#d4a04a","Honey rewards"],
    ["--berry","#c5612e","Clay accent"],
    ["--font-display","Outfit","Sans-serif géométrique"],
    ["--radius-lg","22px","Crisp rounded"],
  ];
  const migration = da.key==="bookshop"
    ? `--font-display → "DM Sans", system-ui, sans-serif
--bg-deep      → #f1e3c8       ${"// inverse: wheat"}
--bg-panel     → #fbf3df
--bg-hover     → rgba(184,85,48,.08)
--accent       → #b85530       ${"// terracotta saturée"}
--gold         → #c89a3a
--green        → #7a8e4a
--red          → #a04050       ${"// berry"}
--text         → #3a2418
--blur         → none
--radius-lg    → 20px`
    : `--font-display → "Outfit", system-ui, sans-serif
--bg-deep      → #f6f1e2       ${"// inverse: cream"}
--bg-panel     → #fdf9ec
--bg-hover     → rgba(94,138,90,.08)
--accent       → #5e8a5a       ${"// sage dominante"}
--gold         → #d4a04a
--green        → #5e8a5a
--red          → #c5612e       ${"// clay"}
--text         → #2a3a2a
--blur         → none
--radius-lg    → 22px`;

  const titleA=da.name.split(" ")[0];
  const titleB=da.name.split(" ").slice(1).join(" ");
  return (
    <div className="ds frame" data-da={da.key}>
      <span className="frame-label">Design System · {da.name}</span>
      <div className="ds-hd">
        <div>
          <div style={{fontSize:12,letterSpacing:".12em",textTransform:"uppercase",color:"var(--ink-3)",fontWeight:600}}>Direction artistique · {da.key.toUpperCase()}</div>
          <h2 style={{marginTop:10}}>{titleA} <span className="em">{titleB}</span></h2>
          <p>{da.description}</p>
          <p style={{marginTop:18,fontFamily:"var(--font-display)",fontWeight:600,fontSize:18,color:"var(--accent)",letterSpacing:"-.01em"}}>{da.positioning}</p>
        </div>
        <dl className="ds-meta">
          <dt>Audience</dt><dd>Freelances, étudiants, deep workers</dd>
          <dt>Vibe</dt><dd>{da.tag}</dd>
          <dt>Pixel-art</dt><dd>Conservé (room iso)</dd>
          <dt>Famille</dt><dd>Cozy Café · sans-serif</dd>
          <dt>Display</dt><dd>{da.type.display}</dd>
          <dt>Body</dt><dd>{da.type.body}</dd>
          <dt>Mono</dt><dd>{da.type.mono}</dd>
        </dl>
      </div>

      <div className="ds-grid">
        <div className="ds-block wide mood">
          <h3 style={{padding:"18px 18px 0"}}>Moodboard</h3>
          <div className="mood-grid" style={{marginTop:14}}>
            {[0,1,2,3,4,5,6,7].map(v=><MoodCell key={v} daKey={da.key} variant={v}/>)}
          </div>
          <div className="mood-quote">
            {da.key==="bookshop"
              ? "« Une librairie-café un samedi après-midi. Le bois grince, le café embaume, les pages tournent doucement. »"
              : "« 9 h du matin dans une véranda. Les feuilles bougent au soleil, la vapeur monte de la tasse. On respire. »"}
          </div>
        </div>

        <div className="ds-block">
          <h3>Palette</h3>
          <div className="swatch-row">
            {da.swatches.map((s,i)=>(
              <div key={i} className="swatch">
                <div className="chip" style={{background:s.h}}/>
                <div className="nm">{s.n}</div>
                <div className="hx">{s.h}</div>
              </div>
            ))}
          </div>
        </div>

        <div className="ds-block">
          <h3>Typographie</h3>
          <div className="type-row">
            <div className="sample">
              <div className="lbl">Display · {da.fontDisplay}</div>
              <div style={{fontFamily:"var(--font-display)",fontSize:32,fontWeight:700,letterSpacing:"-.025em",lineHeight:1}}>Tâches du jour</div>
            </div>
            <div className="sample">
              <div className="lbl">Body · Inter</div>
              <div style={{fontSize:14,lineHeight:1.5,color:"var(--ink-2)"}}>Trouve ton fauteuil, lance ton timer, retrouve ta concentration en bonne compagnie.</div>
            </div>
            <div className="sample">
              <div className="lbl">Mono · JetBrains</div>
              <div style={{fontFamily:"var(--font-mono)",fontSize:22,fontWeight:600,letterSpacing:"-.02em"}}>17:42 · +10🪙</div>
            </div>
          </div>
        </div>

        <div className="ds-block wide">
          <h3>Composants clés</h3>
          <div className="cmpt-row">
            <div className="timer"><span className="pulse"></span><span>Focus</span><span className="num">17:42</span></div>
            <span className="badge gold">🪙 1 248</span>
            <span className="badge streak">🔥 12j</span>
            <span className="badge">⬆ Nv 14</span>
            <button className="fab" style={{position:"static"}}>✨ Lancer un Pomodoro</button>
            <div className="cb checked">✓</div>
            <div className="av-circle" style={{width:42,height:42,fontSize:16}}>L</div>
          </div>
          <div className="cmpt-row" style={{marginTop:14}}>
            <div className="task" style={{background:"var(--bg-panel-2)",minWidth:240}}><span className="cb"/><span className="cat" style={{background:"var(--accent)"}}/><span className="t">Maquette hero hi-fi</span><span className="pts">+15</span></div>
            <div className="task done" style={{background:"var(--bg-panel-2)",minWidth:200}}><span className="cb checked">✓</span><span className="cat" style={{background:"var(--moss)"}}/><span className="t">Méditer 10 min</span><span className="pts">+5</span></div>
            <div className="shop-item" style={{minWidth:96}}><div className="em">{da.key==="bookshop"?"📚":"🌿"}</div><div className="nm">{da.key==="bookshop"?"Livres":"Monstera"}</div><div className="pr">🪙 120</div></div>
          </div>
          <div className="cmpt-row" style={{marginTop:14,alignItems:"flex-start"}}>
            <div className="chat" style={{position:"static",width:300}}>
              <div className="chat-h">
                <div className="dot"/>
                <div className="ti">Salon · {da.key==="bookshop"?"Bookshop":"Garden"}</div>
                <div className="meta">5 ici</div>
              </div>
              <div className="chat-body">
                <div className="chat-msg system">— Tom a démarré un Pomodoro 🍅</div>
                <div className="chat-msg"><span className="who" style={{color:"var(--moss)"}}>Tom</span><span>on se synchro pour 14 h ?</span></div>
                <div className="chat-msg"><span className="who" style={{color:"var(--accent)"}}>Léa</span><span>partante 🙌</span></div>
              </div>
              <div className="chat-input"><input placeholder="Écrire au salon…"/><button className="send">↑</button></div>
            </div>
          </div>
        </div>

        <div className="ds-block">
          <h3>Tokens (extraits)</h3>
          <div className="tokens">
            {tokens.map((t,i)=>(<React.Fragment key={i}>
              <code>{t[0]}</code>
              <span style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{width:18,height:18,borderRadius:4,background:t[1].startsWith("#")?t[1]:"var(--bg-panel-2)",border:"1px solid var(--border)"}}/>
                <span style={{fontSize:12,color:"var(--ink-3)"}}>{t[2]}</span>
              </span>
              <span className="pv">{t[1]}</span>
            </React.Fragment>))}
          </div>
        </div>

        <div className="ds-block full">
          <h3>Note technique — migration depuis App.css</h3>
          <p style={{fontSize:13,color:"var(--ink-2)",marginBottom:12,maxWidth:"70ch",lineHeight:1.6}}>
            Variante de la famille « Cozy Café » : tout en sans-serif. Remplacer le bloc <code style={{fontFamily:"var(--font-mono)",fontSize:12,background:"var(--bg-panel-2)",padding:"1px 6px",borderRadius:4}}>:root</code> de <code style={{fontFamily:"var(--font-mono)",fontSize:12,background:"var(--bg-panel-2)",padding:"1px 6px",borderRadius:4}}>App.css</code> par les valeurs ci-dessous, et ajouter l'import Google Fonts correspondant. Le <code style={{fontFamily:"var(--font-mono)",fontSize:12,background:"var(--bg-panel-2)",padding:"1px 6px",borderRadius:4}}>PALETTE</code> côté avatars dans <code style={{fontFamily:"var(--font-mono)",fontSize:12,background:"var(--bg-panel-2)",padding:"1px 6px",borderRadius:4}}>App.tsx</code> peut rester ; ajuster <code style={{fontFamily:"var(--font-mono)",fontSize:12,background:"var(--bg-panel-2)",padding:"1px 6px",borderRadius:4}}>ROOM_META</code> dans <code style={{fontFamily:"var(--font-mono)",fontSize:12,background:"var(--bg-panel-2)",padding:"1px 6px",borderRadius:4}}>net/types.ts</code> pour les teintes de sol/mur.
          </p>
          <div className="note">{migration}</div>
        </div>
      </div>
    </div>
  );
}

  const da=DA["bookshop"];
  return (
    <>
      <div className="da-bar">
        <h1>gamiTask <span className="s">· Café Bookshop</span></h1>
        <span className="da-tab" aria-pressed="true"><span className="dot" style={{background:da.chipColor}}/><span>{da.name}</span></span>

</script>
</body>
