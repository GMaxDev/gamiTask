upstream gamitask_server {
    server server:3001;
}

server {
    listen 80;
    server_name _;

    # ── Frontend SPA ──────────────────────────────────────────────────────────
    # La landing à /, le café à /app/ : chacun retombe sur son index.html pour le routage côté client.
    root /usr/share/nginx/html;

    # Compression des textes. Si un proxy en amont compresse déjà, nginx ne recompresse pas un flux déjà encodé.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Les assets Vite portent un hash dans leur nom : cache immuable d'un an, jamais revalidé.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Les index.html pointent vers les assets hashés : toujours revalidés pour prendre un nouveau déploiement.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /app/index.html { add_header Cache-Control "no-cache"; }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Socket.IO WebSocket ──────────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass http://gamitask_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }

    # ── API REST (auth Google, feedback, etc.) ────────────────────────────────
    location /auth/ {
        proxy_pass http://gamitask_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://gamitask_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /twitch/ {
        proxy_pass http://gamitask_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
