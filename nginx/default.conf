upstream gamitask_server {
    server server:3001;
}

server {
    listen 80;
    server_name _;

    # ── Frontend SPA : /gamiTask ─────────────────────────────────────────────
    # Redirige /gamiTask (sans slash) vers /gamiTask/
    location = /gamiTask {
        return 301 /gamiTask/;
    }

    location /gamiTask/ {
        alias /usr/share/nginx/html/gamiTask/;
        # Fallback vers index.html pour le routing côté client (React Router)
        try_files $uri $uri/ /gamiTask/index.html;
    }

    # ── Socket.IO WebSocket ──────────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass http://gamitask_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }

    # ── API REST (auth Google, feedback, etc.) ────────────────────────────────
    location /auth/ {
        proxy_pass http://gamitask_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://gamitask_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Réponse par défaut pour la racine
    location = / {
        return 301 /gamiTask/;
    }
}
